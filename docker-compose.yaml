services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zelestia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  

volumes:
  postgres_data:

